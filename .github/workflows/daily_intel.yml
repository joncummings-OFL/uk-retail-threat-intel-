name: Daily UK Retail Threat Scraper & Summary

on:
schedule:
# 07:30 UTC every Monday through Friday
- cron: '30 7 * * 1-5'
workflow_dispatch:

permissions:
contents: write

jobs:
run-pipeline:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: Install Dependencies
    run: |
      pip install -r requirements.txt

  - name: Execute Threat Intelligence Pipeline
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || secrets.GOOGLE_CHAT_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || secrets.DASHBOARD_URL }}
    run: |
      python threat_intel_pipeline.py

  - name: Commit and Push Updated Threat Feed & EDLs
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add data/ || true
      git diff --staged --quiet || (git commit -m "Auto-update threat intel, EDLs, STIX and RSS [skip ci]" && git push)
